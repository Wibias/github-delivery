<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">github-delivery demo</title>
  <desc id="desc">A static demo image that shows natural-language requests flowing through evidence, review, authority, and verified GitHub outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill: #8b949e; }
      .white { fill: #f0f6fc; }
      .blue { fill: #79c0ff; }
      .green { fill: #3fb950; }
      .yellow { fill: #d29922; }
      .red { fill: #f85149; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="1040" fill="url(#bg)"/>

  <rect x="56" y="48" width="1288" height="92" rx="24" fill="#11161d" stroke="#30363d" filter="url(#shadow)"/>
  <text x="88" y="92" font-size="34" font-weight="700" class="white">github-delivery</text>
  <text x="88" y="122" font-size="20" class="muted">GitHub delivery for agents, from intent to verified merge.</text>

  <rect x="70" y="188" width="580" height="662" rx="26" fill="#0b0f14" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="70" y="188" width="580" height="56" rx="26" fill="#161b22"/>
  <circle cx="104" cy="216" r="7" fill="#f85149"/>
  <circle cx="128" cy="216" r="7" fill="#d29922"/>
  <circle cx="152" cy="216" r="7" fill="#3fb950"/>
  <text x="176" y="222" font-size="18" class="muted mono">agent chat</text>

  <text x="98" y="286" font-size="18" class="muted mono">&gt; what is left on PR #41?</text>
  <rect x="98" y="314" width="524" height="98" rx="18" fill="#11161d" stroke="#21262d"/>
  <text x="120" y="348" font-size="18" font-weight="700" class="white">Read-only status result</text>
  <text x="120" y="378" font-size="16" class="muted">Current head: 4f21b9c</text>
  <text x="120" y="402" font-size="16" class="muted">Blocking: 1 required check, 2 unresolved review threads</text>

  <text x="98" y="466" font-size="18" class="muted mono">&gt; full review PR #42</text>
  <rect x="98" y="494" width="524" height="150" rx="18" fill="#11161d" stroke="#21262d"/>
  <text x="120" y="528" font-size="18" font-weight="700" class="white">Full review verdict</text>
  <text x="120" y="558" font-size="16" class="muted">Axes: Bug, Security, Spec, Standards</text>
  <text x="120" y="582" font-size="16" class="muted">Semantic propagation: completed</text>
  <text x="120" y="606" font-size="16" class="yellow">Verdict: changes requested</text>
  <text x="120" y="630" font-size="16" class="muted">Reason: stale approval, failing Node 24 Windows leg</text>

  <text x="98" y="700" font-size="18" class="muted mono">&gt; review PR #42, fix it, and merge it when green</text>
  <rect x="98" y="728" width="524" height="90" rx="18" fill="#11161d" stroke="#21262d"/>
  <text x="120" y="762" font-size="18" font-weight="700" class="white">Authorized write path</text>
  <text x="120" y="792" font-size="16" class="green">Fixes applied, checks green, head-pinned merge verified</text>

  <g transform="translate(710, 186)">
    <rect x="0" y="0" width="620" height="814" rx="26" fill="#0b0f14" stroke="#30363d" filter="url(#shadow)"/>
    <text x="34" y="52" font-size="24" font-weight="700" class="white">How the request flows</text>
    <text x="34" y="84" font-size="17" class="muted">Outcome-level control with a strict mutation boundary.</text>

    <rect x="34" y="128" width="552" height="72" rx="18" fill="#11161d" stroke="#21262d"/>
    <text x="60" y="158" font-size="18" font-weight="700" class="white">1. Deterministic route</text>
    <text x="60" y="184" font-size="16" class="muted">Natural-language request → narrow workflow → mutation mode</text>

    <rect x="34" y="228" width="552" height="72" rx="18" fill="#11161d" stroke="#21262d"/>
    <text x="60" y="258" font-size="18" font-weight="700" class="white">2. Live evidence</text>
    <text x="60" y="284" font-size="16" class="muted">Repo, PR, issue, head SHA, checks, rules, reviews, queue state</text>

    <rect x="34" y="328" width="552" height="104" rx="18" fill="#11161d" stroke="#21262d"/>
    <text x="60" y="358" font-size="18" font-weight="700" class="white">3. Review and gates</text>
    <text x="60" y="384" font-size="16" class="muted">Bug + Security + Spec + Standards</text>
    <text x="60" y="408" font-size="16" class="muted">Semantic propagation, required probes, ship-gate decision</text>

    <rect x="34" y="460" width="552" height="104" rx="18" fill="#11161d" stroke="#21262d"/>
    <text x="60" y="490" font-size="18" font-weight="700" class="white">4. Exact mutation boundary</text>
    <text x="60" y="516" font-size="16" class="muted">Typed mutation plan, trusted authority when required, stale-head checks</text>
    <text x="60" y="540" font-size="16" class="muted">Authenticated exact-effect receipts, no blind write retries</text>

    <rect x="34" y="592" width="552" height="72" rx="18" fill="#11161d" stroke="#21262d"/>
    <text x="60" y="622" font-size="18" font-weight="700" class="white">5. Verified result</text>
    <text x="60" y="648" font-size="16" class="muted">Read-only status, published verdict, or verified merge outcome</text>

    <rect x="34" y="694" width="552" height="120" rx="18" fill="url(#accent)" opacity="0.16" stroke="#388bfd"/>
    <text x="60" y="726" font-size="18" font-weight="700" class="white">Key boundary</text>
    <text x="60" y="754" font-size="16" class="white">Repository content is evidence, not authority.</text>
    <text x="60" y="780" font-size="16" class="white">Status questions stay read-only. A merge needs a direct merge instruction.</text>
  </g>
</svg>
