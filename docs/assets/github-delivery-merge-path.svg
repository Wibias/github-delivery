<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">github-delivery read-only and merge paths</title>
  <desc id="desc">Comparison between a read-only merge-readiness question and an explicit merge instruction that must pass review, authority, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      text{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.w{fill:#f0f6fc}.m{fill:#8b949e}.b{fill:#79c0ff}.g{fill:#3fb950}.y{fill:#d29922}
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="70" y="74" font-size="34" font-weight="700" class="w">The word “merge” does not grant merge authority.</text>
  <text x="70" y="108" font-size="19" class="m">Intent determines the path. Live evidence determines the result.</text>

  <rect x="70" y="150" width="600" height="540" rx="26" fill="#0b0f14" stroke="#30363d" filter="url(#shadow)"/>
  <text x="104" y="198" font-size="20" font-weight="700" class="b">STATUS QUESTION</text>
  <rect x="104" y="226" width="532" height="68" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="128" y="268" font-size="19" class="w mono">is PR #42 safe to merge?</text>
  <text x="104" y="338" font-size="18" font-weight="700" class="w">1. Route: read-only</text>
  <text x="104" y="376" font-size="17" class="m">Resolve current head, checks, reviews, rulesets, queue state</text>
  <text x="104" y="414" font-size="18" font-weight="700" class="w">2. Run review and ship gates</text>
  <text x="104" y="452" font-size="17" class="m">No merge mutation is planned or authorized</text>
  <text x="104" y="490" font-size="18" font-weight="700" class="w">3. Return evidence-backed status</text>
  <rect x="104" y="526" width="532" height="112" rx="18" fill="#11161d" stroke="#388bfd"/>
  <text x="128" y="562" font-size="17" class="m">Example result</text>
  <text x="128" y="592" font-size="21" font-weight="700" class="y">BLOCKED</text>
  <text x="128" y="620" font-size="16" class="m">1 required check pending · 2 unresolved threads</text>

  <rect x="730" y="150" width="600" height="540" rx="26" fill="#0b0f14" stroke="#30363d" filter="url(#shadow)"/>
  <text x="764" y="198" font-size="20" font-weight="700" class="g">DIRECT MERGE INSTRUCTION</text>
  <rect x="764" y="226" width="532" height="68" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="788" y="268" font-size="18" class="w mono">review PR #42, fix it, and merge it when green</text>
  <text x="764" y="338" font-size="18" font-weight="700" class="w">1. Review + fix on the exact head</text>
  <text x="764" y="376" font-size="17" class="m">Fresh evidence, required probes, CI, feedback, readiness</text>
  <text x="764" y="414" font-size="18" font-weight="700" class="w">2. Bind the exact write</text>
  <text x="764" y="452" font-size="17" class="m">Expected head · exact mutation plan · trusted authority when required</text>
  <text x="764" y="490" font-size="18" font-weight="700" class="w">3. Execute once, then verify</text>
  <rect x="764" y="526" width="532" height="112" rx="18" fill="#11161d" stroke="#2ea043"/>
  <text x="788" y="562" font-size="17" class="m">Possible verified result</text>
  <text x="788" y="592" font-size="21" font-weight="700" class="g">MERGED</text>
  <text x="788" y="620" font-size="16" class="m">Head-pinned write · postcondition verified · no blind retry</text>
</svg>
