name: Windows trace bins

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-trace-bins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace-bins:
    name: npm trace bins / windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Execute installed trace bins
        run: node --test tests/unit/windows-trace-bin-entrypoints.test.mjs
