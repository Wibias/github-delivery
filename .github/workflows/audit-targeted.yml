name: Audit Targeted

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live-target
            file: tests/unit/live-fixture-target.test.mjs
          - name: live-credential
            file: tests/unit/live-fixture-credential.test.mjs
          - name: live-lifecycle
            file: tests/unit/live-github-fixture.test.mjs
          - name: live-cleanup
            file: tests/unit/live-fixture-cleanup.test.mjs
          - name: mutation-boundary
            file: tests/unit/mutation-boundary-security.test.mjs
          - name: mutation-broker
            file: tests/unit/github-mutation-broker.test.mjs
          - name: workflow-security
            file: tests/unit/workflow-security.test.mjs
          - name: distribution
            file: tests/unit/distribution.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test ${{ matrix.file }}
