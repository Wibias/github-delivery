name: Live Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2"

concurrency:
  group: live-integration-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lifecycle:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_FIXTURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run fixture contract tests
        run: >-
          node --test
          tests/unit/live-github-fixture.test.mjs
          tests/unit/live-fixture-cleanup.test.mjs
          tests/unit/live-fixture-credential.test.mjs

      - name: Verify live fixture credential
        id: credential
        env:
          GH_TOKEN: ${{ secrets.LIVE_FIXTURE_TOKEN }}
        run: |
          set -o pipefail
          node scripts/verify-live-fixture-token.mjs \
            "${GITHUB_REPOSITORY}" \
            --base "main" \
            | tee live-fixture-credential.json

      - name: Exercise live GitHub lifecycle
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.LIVE_FIXTURE_TOKEN }}
        run: >-
          node scripts/live-github-fixture.mjs
          "${GITHUB_REPOSITORY}"
          --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --base "main"
          --disposition close
          --receipt live-fixture-receipt.json

      - name: Clean up fixture resources
        if: always() && steps.credential.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.LIVE_FIXTURE_TOKEN }}
        run: >-
          node scripts/cleanup-live-github-fixture.mjs
          "${GITHUB_REPOSITORY}"
          --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --base "main"
          --disposition close
          --receipt live-fixture-receipt.json
          --cleanup-report live-fixture-cleanup.json

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-fixture-credential.json
            live-fixture-receipt.json
            live-fixture-cleanup.json
          if-no-files-found: error
          retention-days: 30
