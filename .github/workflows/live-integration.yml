name: Live Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2"

concurrency:
  group: live-integration-${{ github.repository }}-${{ vars.LIVE_FIXTURE_REPOSITORY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lifecycle:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_FIXTURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIXTURE_REPOSITORY: ${{ vars.LIVE_FIXTURE_REPOSITORY }}
      FIXTURE_REPOSITORY_ID: ${{ vars.LIVE_FIXTURE_REPOSITORY_ID }}
      FIXTURE_APP_CLIENT_ID: ${{ vars.LIVE_FIXTURE_APP_CLIENT_ID }}
    steps:
      - name: Validate dedicated fixture target configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIXTURE_REPOSITORY}" ]]; then
            echo "LIVE_FIXTURE_REPOSITORY must name a dedicated OWNER/REPO fixture repository." >&2
            exit 1
          fi
          if [[ -z "${FIXTURE_REPOSITORY_ID}" || ! "${FIXTURE_REPOSITORY_ID}" =~ ^[0-9]+$ ]]; then
            echo "LIVE_FIXTURE_REPOSITORY_ID must be the immutable numeric repository id of the dedicated fixture repository." >&2
            exit 1
          fi
          if [[ -z "${FIXTURE_APP_CLIENT_ID}" ]]; then
            echo "LIVE_FIXTURE_APP_CLIENT_ID must identify the dedicated fixture GitHub App." >&2
            exit 1
          fi
          if [[ "${FIXTURE_REPOSITORY,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo "LIVE_FIXTURE_REPOSITORY must be separate from GITHUB_REPOSITORY." >&2
            exit 1
          fi
          echo "The target must also contain .github/github-delivery-live-fixture.json on main, bound to both source and fixture numeric repository ids."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run fixture contract tests
        run: >-
          node --test
          tests/unit/live-github-fixture.test.mjs
          tests/unit/live-fixture-target.test.mjs
          tests/unit/live-fixture-cleanup.test.mjs
          tests/unit/live-fixture-credential.test.mjs

      - name: Create fixture-scoped GitHub App token
        id: fixture-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LIVE_FIXTURE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIVE_FIXTURE_APP_PRIVATE_KEY }}
          repositories: ${{ vars.LIVE_FIXTURE_REPOSITORY }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read

      - name: Verify live fixture credential and target identity
        id: credential
        env:
          GH_TOKEN: ${{ steps.fixture-app-token.outputs.token }}
        run: |
          set -o pipefail
          node scripts/verify-live-fixture-token.mjs \
            "${FIXTURE_REPOSITORY}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --fixture-repo-id "${FIXTURE_REPOSITORY_ID}" \
            --installation-id "${{ steps.fixture-app-token.outputs.installation-id }}" \
            --base "main" \
            | tee live-fixture-credential.json

      - name: Exercise live GitHub lifecycle
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.fixture-app-token.outputs.token }}
        run: >-
          node scripts/live-github-fixture.mjs
          "${FIXTURE_REPOSITORY}"
          --source-repo "${GITHUB_REPOSITORY}"
          --fixture-repo-id "${FIXTURE_REPOSITORY_ID}"
          --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --base "main"
          --disposition close
          --receipt live-fixture-receipt.json

      - name: Clean up fixture resources
        if: always() && steps.credential.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.fixture-app-token.outputs.token }}
        run: >-
          node scripts/cleanup-live-github-fixture.mjs
          "${FIXTURE_REPOSITORY}"
          --source-repo "${GITHUB_REPOSITORY}"
          --fixture-repo-id "${FIXTURE_REPOSITORY_ID}"
          --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --base "main"
          --disposition close
          --receipt live-fixture-receipt.json
          --cleanup-report live-fixture-cleanup.json

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-fixture-credential.json
            live-fixture-receipt.json
            live-fixture-cleanup.json
          if-no-files-found: error
          retention-days: 30
