name: Refine Authority icon from WinUI glyph

on:
  push:
    branches:
      - fix/authority-xaml-startup

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Generate multi-resolution icon from the in-app E83D glyph
        shell: pwsh
        run: |
          $source = @'
          using System;
          using System.Collections.Generic;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Drawing.Imaging;
          using System.Drawing.Text;
          using System.IO;

          public static class AuthorityIconGenerator
          {
              private static readonly int[] Sizes = new[] { 16, 20, 24, 32, 40, 48, 64, 128, 256 };
              private static readonly Color Peach = Color.FromArgb(255, 255, 163, 130);

              public static void Generate(string path)
              {
                  using var family = LoadIconFont();
                  using var source = RenderSource(family);
                  var bounds = FindAlphaBounds(source);
                  var frames = new List<byte[]>();

                  foreach (var size in Sizes)
                  {
                      using var rendered = RenderSize(source, bounds, size);
                      frames.Add(BuildDibFrame(rendered));
                  }

                  Directory.CreateDirectory(Path.GetDirectoryName(path)!);
                  using var stream = File.Create(path);
                  using var writer = new BinaryWriter(stream);
                  writer.Write((ushort)0);
                  writer.Write((ushort)1);
                  writer.Write((ushort)frames.Count);

                  var offset = 6 + (16 * frames.Count);
                  for (var index = 0; index < frames.Count; index++)
                  {
                      var size = Sizes[index];
                      var dimension = (byte)(size == 256 ? 0 : size);
                      writer.Write(dimension);
                      writer.Write(dimension);
                      writer.Write((byte)0);
                      writer.Write((byte)0);
                      writer.Write((ushort)1);
                      writer.Write((ushort)32);
                      writer.Write(frames[index].Length);
                      writer.Write(offset);
                      offset += frames[index].Length;
                  }

                  foreach (var frame in frames) writer.Write(frame);
              }

              private static FontFamily LoadIconFont()
              {
                  try
                  {
                      return new FontFamily("Segoe Fluent Icons");
                  }
                  catch (ArgumentException)
                  {
                      return new FontFamily("Segoe MDL2 Assets");
                  }
              }

              private static Bitmap RenderSource(FontFamily family)
              {
                  const int canvas = 1024;
                  var bitmap = new Bitmap(canvas, canvas, PixelFormat.Format32bppArgb);
                  using var graphics = Graphics.FromImage(bitmap);
                  graphics.Clear(Color.Transparent);
                  graphics.SmoothingMode = SmoothingMode.AntiAlias;
                  graphics.TextRenderingHint = TextRenderingHint.AntiAliasGridFit;
                  graphics.PixelOffsetMode = PixelOffsetMode.HighQuality;

                  using var font = new Font(family, 800f, FontStyle.Regular, GraphicsUnit.Pixel);
                  using var brush = new SolidBrush(Peach);
                  using var format = (StringFormat)StringFormat.GenericTypographic.Clone();
                  format.FormatFlags |= StringFormatFlags.MeasureTrailingSpaces;
                  var glyph = "\uE83D";
                  var measured = graphics.MeasureString(glyph, font, new PointF(0, 0), format);
                  var x = (canvas - measured.Width) / 2f;
                  var y = (canvas - measured.Height) / 2f;
                  graphics.DrawString(glyph, font, brush, new PointF(x, y), format);
                  return bitmap;
              }

              private static Rectangle FindAlphaBounds(Bitmap bitmap)
              {
                  var minX = bitmap.Width;
                  var minY = bitmap.Height;
                  var maxX = -1;
                  var maxY = -1;

                  for (var y = 0; y < bitmap.Height; y++)
                  {
                      for (var x = 0; x < bitmap.Width; x++)
                      {
                          if (bitmap.GetPixel(x, y).A <= 8) continue;
                          minX = Math.Min(minX, x);
                          minY = Math.Min(minY, y);
                          maxX = Math.Max(maxX, x);
                          maxY = Math.Max(maxY, y);
                      }
                  }

                  if (maxX < minX || maxY < minY) throw new InvalidOperationException("E83D glyph rendered no visible pixels.");
                  return Rectangle.FromLTRB(minX, minY, maxX + 1, maxY + 1);
              }

              private static Bitmap RenderSize(Bitmap source, Rectangle sourceBounds, int size)
              {
                  var bitmap = new Bitmap(size, size, PixelFormat.Format32bppArgb);
                  using var graphics = Graphics.FromImage(bitmap);
                  graphics.Clear(Color.Transparent);
                  graphics.CompositingMode = CompositingMode.SourceCopy;
                  graphics.CompositingQuality = CompositingQuality.HighQuality;
                  graphics.InterpolationMode = InterpolationMode.HighQualityBicubic;
                  graphics.PixelOffsetMode = PixelOffsetMode.HighQuality;
                  graphics.SmoothingMode = SmoothingMode.HighQuality;

                  var margin = Math.Max(1, (int)Math.Round(size * 0.11));
                  var available = size - (margin * 2);
                  var scale = Math.Min(available / (double)sourceBounds.Width, available / (double)sourceBounds.Height);
                  var width = Math.Max(1, (int)Math.Round(sourceBounds.Width * scale));
                  var height = Math.Max(1, (int)Math.Round(sourceBounds.Height * scale));
                  var target = new Rectangle((size - width) / 2, (size - height) / 2, width, height);
                  graphics.DrawImage(source, target, sourceBounds, GraphicsUnit.Pixel);
                  return bitmap;
              }

              private static byte[] BuildDibFrame(Bitmap bitmap)
              {
                  var size = bitmap.Width;
                  var maskStride = ((size + 31) / 32) * 4;
                  using var stream = new MemoryStream();
                  using var writer = new BinaryWriter(stream);

                  writer.Write(40);
                  writer.Write(size);
                  writer.Write(size * 2);
                  writer.Write((ushort)1);
                  writer.Write((ushort)32);
                  writer.Write(0);
                  writer.Write(size * size * 4);
                  writer.Write(0);
                  writer.Write(0);
                  writer.Write(0);
                  writer.Write(0);

                  for (var y = size - 1; y >= 0; y--)
                  {
                      for (var x = 0; x < size; x++)
                      {
                          var pixel = bitmap.GetPixel(x, y);
                          writer.Write(pixel.B);
                          writer.Write(pixel.G);
                          writer.Write(pixel.R);
                          writer.Write(pixel.A);
                      }
                  }

                  for (var y = size - 1; y >= 0; y--)
                  {
                      var row = new byte[maskStride];
                      for (var x = 0; x < size; x++)
                      {
                          if (bitmap.GetPixel(x, y).A != 0) continue;
                          row[x / 8] |= (byte)(0x80 >> (x % 8));
                      }
                      writer.Write(row);
                  }

                  return stream.ToArray();
              }
          }
          '@

          Add-Type -TypeDefinition $source -ReferencedAssemblies System.Drawing
          [AuthorityIconGenerator]::Generate((Join-Path $PWD 'authority-host/windows/GitHubDeliveryAuthority/Assets/DeliveryAuthority.ico'))

      - name: Commit exact in-app glyph icon and remove bootstrap workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add authority-host/windows/GitHubDeliveryAuthority/Assets/DeliveryAuthority.ico
          git rm .github/workflows/authority-icon-glyph.yml
          git commit -m 'refine: reuse in-app authority glyph for program icon'
          git push origin HEAD:fix/authority-xaml-startup
