name: WinUI lock bootstrap

on:
  pull_request:
    paths:
      - "authority-host/windows/GitHubDeliveryAuthority/**"
      - ".github/workflows/winui-lock-bootstrap.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate WinUI lock file
        shell: pwsh
        run: |
          $project = "authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj"
          $lock = "authority-host/windows/GitHubDeliveryAuthority/packages.lock.json"
          dotnet restore $project --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "---PACKAGES_LOCK_START---"
          Get-Content -Raw $lock
          Write-Host "---PACKAGES_LOCK_END---"
