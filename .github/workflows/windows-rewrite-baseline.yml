name: Windows rewrite baseline

on:
  pull_request:
    paths:
      - "scripts/lib/rewrite-baseline-store.mjs"
      - "scripts/lib/github-lifecycle-mutation-broker.mjs"
      - "tests/unit/push-cleanup-convergence.test.mjs"
      - ".github/workflows/windows-rewrite-baseline.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/lib/rewrite-baseline-store.mjs"
      - "scripts/lib/github-lifecycle-mutation-broker.mjs"
      - "tests/unit/push-cleanup-convergence.test.mjs"
      - ".github/workflows/windows-rewrite-baseline.yml"

permissions:
  contents: read

concurrency:
  group: windows-rewrite-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rewrite-baseline:
    name: Rewrite baseline / windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Exercise rewrite baseline persistence and push retry convergence
        run: node --test tests/unit/push-cleanup-convergence.test.mjs
