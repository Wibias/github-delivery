name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify tagged source belongs to protected main lineage
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          node scripts/verify-release-source.mjs
          "$RELEASE_REPOSITORY"
          "$RELEASE_SOURCE_COMMIT"
          "$RELEASE_DEFAULT_BRANCH"

      - name: Run repository checks
        run: npm run check

      - name: Build release subjects
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build:dist -- --source-commit "${SOURCE_COMMIT}"

      - name: Prepare and verify release
        run: >-
          node scripts/prepare-release.mjs
          --event "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --source-commit "${{ github.sha }}"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-delivery-release-${{ github.sha }}
          path: |
            dist/manifest.json
            dist/SHA256SUMS
            dist/sbom.spdx.json
            dist/RELEASE_NOTES.md
            dist/release-metadata.json
            dist/github-delivery-v*.zip
            dist/github-delivery-v*.tar.gz
          if-no-files-found: error
          retention-days: 14

  authority_host:
    name: Build Windows authority host release asset
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($Version -notmatch '^\d+\.\d+\.\d+$') { throw 'package version must be semantic x.y.z' }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore and publish Windows authority host
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          $PublishDir = Join-Path $env:RUNNER_TEMP 'github-delivery-authority-publish'
          dotnet restore $Project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $Project --configuration Release --runtime win-x64 --self-contained true --no-restore --output $PublishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-authority-host-release.mjs --publish-dir "$PublishDir" --out-dir "dist/authority-host" --version "${{ steps.release_version.outputs.version }}" --source-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows authority host release subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-delivery-authority-${{ github.sha }}
          path: |
            dist/authority-host/github-delivery-authority-v*.zip
            dist/authority-host/github-delivery-authority-v*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish attested release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - validate
      - authority_host
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Reverify tagged source belongs to protected main lineage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          node scripts/verify-release-source.mjs
          "$RELEASE_REPOSITORY"
          "$RELEASE_SOURCE_COMMIT"
          "$RELEASE_DEFAULT_BRANCH"

      - name: Rebuild from the tagged commit
        run: |
          npm run check
          npm run build:dist -- --source-commit "${GITHUB_SHA}"
          node scripts/prepare-release.mjs \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --source-commit "${GITHUB_SHA}"

      - name: Download Windows authority host release subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-delivery-authority-${{ github.sha }}
          path: dist/authority-host

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/github-delivery-v*.zip
            dist/github-delivery-v*.tar.gz

      - name: Attest Windows authority host
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/authority-host/github-delivery-authority-v*.zip

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/github-delivery-v*.zip
          sbom-path: dist/sbom.spdx.json

      - name: Validate npm package
        run: npm run package:check

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1

      - name: Publish npm package
        run: npm publish --access public

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && {
            echo "release ${GITHUB_REF_NAME} already exists" >&2
            exit 1
          }
          gh release create "${GITHUB_REF_NAME}" \
            dist/github-delivery-v*.zip \
            dist/github-delivery-v*.tar.gz \
            dist/manifest.json \
            dist/SHA256SUMS \
            dist/sbom.spdx.json \
            dist/authority-host/github-delivery-authority-v*.zip \
            dist/authority-host/github-delivery-authority-v*.json \
            --verify-tag \
            --title "github-delivery ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md
