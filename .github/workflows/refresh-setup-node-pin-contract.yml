name: Refresh setup-node pin contract

on:
  push:
    branches:
      - "dependabot/github_actions/actions/setup-node-7.1.0"
    paths:
      - ".github/workflows/refresh-setup-node-pin-contract.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refresh pinned-action contract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/cleanup-orphaned-workflows.test.mjs")
          source = path.read_text(encoding="utf-8")
          old = "actions\\/setup-node@820762786026740c76f36085b0efc47a31fe5020"
          new = "actions\\/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale setup-node pin contract, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git rm .github/workflows/refresh-setup-node-pin-contract.yml
          git add tests/unit/cleanup-orphaned-workflows.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update setup-node pin contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
