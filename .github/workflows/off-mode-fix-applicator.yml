name: Off-mode fix applicator

on:
  push:
    branches:
      - fix/off-mode-never-hello

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/off-mode-never-hello
      - name: Apply exact reviewed substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "authority-host/windows/GitHubDeliveryAuthority/ControlCenterWindow.xaml",
              "No Windows Hello prompts. GitHub Delivery’s normal mutation policy still applies.",
              "Ordinary high-assurance writes skip Hello. Independent lifecycle intent and exact-text human replies still require Windows Hello.",
          )

          replace_once(
              "authority-host/windows/README.md",
              "In `high-assurance`, intrinsically high-assurance and autonomous execution requests require trusted authority. In `all`, every executed GitHub mutation does. In `off`, Windows Hello is not an additional mutation requirement; the ordinary github-delivery mutation policy still applies.",
              "In `high-assurance`, intrinsically high-assurance and autonomous execution requests require trusted authority. In `all`, every executed GitHub mutation does. In `off`, ordinary high-assurance writes do not add a Windows Hello requirement, but independently authenticated lifecycle intent and exact-text human replies still require trusted authority; the ordinary github-delivery mutation policy also remains in force.",
          )
          replace_once(
              "authority-host/windows/README.md",
              "- `off` + no Authority host ever installed: do not download or install the component;\n- `high-assurance` / `all` + missing host: `setup` installs the verified stable component on supported Windows x64;",
              "- ordinary stable update with `off` + no Authority host ever installed: do not download or install the component;\n- explicit `setup` provisions the verified stable component even with stored mode `off`, so independently authenticated lifecycle intent and exact-text human replies remain available;\n- `high-assurance` / `all` + missing host: `setup` installs the verified stable component on supported Windows x64;",
          )

          replace_once(
              "references/configuration.md",
              "If the selected mode is `off` and the host has never been installed, setup/update normally does not install it; independently authenticated lifecycle intent and exact-text human replies still need a compatible authority provider before those mutations can execute. Once the host is already installed, stable update keeps it aligned with the skill even when the current mode is `off`; a host newer than stable is never automatically downgraded.",
              "If the selected mode is `off` and the host has never been installed, routine stable update does not install it. Explicit `npx github-delivery setup` does provision the verified host even in Off mode so independently authenticated lifecycle intent and exact-text human replies remain usable. Once the host is installed, stable update keeps it aligned with the skill even when the current mode is `off`; a host newer than stable is never automatically downgraded.",
          )

          replace_once(
              "INSTALL.md",
              "If the effective protection mode is `off` and Authority has never been installed, setup/update does not download or install the component. If Authority is already installed, stable update keeps it aligned even while mode is `off`. A host ahead of stable remains untouched.",
              "If the effective protection mode is `off` and Authority has never been installed, routine stable update does not download or install the component. Explicit `npx github-delivery setup` still provisions the verified Authority host so independently authenticated lifecycle intent and exact-text human replies remain available. If Authority is already installed, stable update keeps it aligned even while mode is `off`. A host ahead of stable remains untouched.",
          )
          replace_once(
              "INSTALL.md",
              "On platforms where that bundled host is unsupported, setup completes with `authority_provider_required`: local/read-only workflows remain usable, but protected GitHub writes stay blocked until a compatible authority provider is configured or the user explicitly chooses `authorityMode=off`. `off` is an opt-out, not the default.",
              "On platforms where that bundled host is unsupported, setup completes with `authority_provider_required`: local/read-only workflows remain usable, but protected GitHub writes stay blocked until a compatible authority provider is configured. Choosing `authorityMode=off` removes ordinary high-assurance Hello protection, but independently authenticated lifecycle intent and exact-text human replies still require trusted authority. `off` is an opt-out, not the default.",
          )

          replace_once(
              "references/setup-prompts.md",
              "Disable Windows Hello protection for github-delivery.",
              "Set github-delivery's Windows Hello protection mode to Off.",
          )
          replace_once(
              "references/setup-prompts.md",
              "Direct natural language is also valid, for example:\n",
              "Direct natural language is also valid. Off disables ordinary high-assurance Hello protection, not independently authenticated lifecycle intent or exact-text human-reply approval. For example:\n",
          )

          replace_once(
              "CHANGELOG.md",
              "### Added\n\n- Full-review verdicts can now submit GitHub Request changes through the mutation broker, and later passes dismiss our pending Request changes before a new request or a merge-ready comment. GitHub Approve stays off unless the user explicitly asks.\n",
              "### Added\n\n- Full-review verdicts can now submit GitHub Request changes through the mutation broker, and later passes dismiss our pending Request changes before a new request or a merge-ready comment. GitHub Approve stays off unless the user explicitly asks.\n\n### Fixed\n\n- Off-mode setup and user-facing guidance now preserve the independently authenticated intent boundary: ordinary high-assurance writes can skip Hello, but lifecycle intent and exact-text human replies still require trusted authority. Explicit `npx github-delivery setup` provisions the verified Windows Authority host even when the stored protection mode is Off; routine stable update remains non-installing when Off has never installed the host.\n",
          )
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add authority-host/windows/GitHubDeliveryAuthority/ControlCenterWindow.xaml authority-host/windows/README.md references/configuration.md INSTALL.md references/setup-prompts.md CHANGELOG.md
          git commit -m "fix: align Off-mode setup and messaging"
          git push origin HEAD:fix/off-mode-never-hello
