name: Architecture Contracts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "references/**"
      - "tests/unit/mutation-action-registry*.test.mjs"
      - "tests/unit/review-context-contract.test.mjs"
      - ".github/workflows/architecture-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "references/**"
      - "tests/unit/mutation-action-registry*.test.mjs"
      - "tests/unit/review-context-contract.test.mjs"
      - ".github/workflows/architecture-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify architecture contracts
        run: >-
          node --test
          tests/unit/mutation-action-registry.test.mjs
          tests/unit/mutation-action-registry-broker.test.mjs
          tests/unit/review-context-contract.test.mjs
