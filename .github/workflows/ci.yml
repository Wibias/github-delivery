name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  addressed-feedback-bootstrap:
    name: Apply GD feedback idempotency fix
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/github-delivery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/github-delivery

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Add regression test and prove RED
        shell: bash
        run: |
          cat > tests/unit/addressed-feedback-comment.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import {
            evaluateFeedbackResolutions,
            isTrustedHumanFeedback,
            normalizeFeedback,
            parseFeedbackResolution,
          } from "../../scripts/lib/watch-feedback.mjs";

          const headOid = "d54ceec1234567890abcdef1234567890abcdef1";
          const commitOid = "d54ceec1234567890abcdef1234567890abcdef1";

          function comment({ id, body, createdAt, login = "maintainer", kind = "issue_comment" }) {
            return normalizeFeedback({
              id,
              body,
              created_at: createdAt,
              user: { login },
              author_association: login === "Wibias" ? "OWNER" : "MEMBER",
            }, kind);
          }

          const canonicalBody = `[GD] Addressed feedback

          feedbacks:
          - issue_comment:101
          - review_comment:202

          commit: d54ceec

          <!-- gd:addressed-feedback head:${headOid} -->`;

          test("parses one GD comment that aggregates multiple feedback items", () => {
            const parsed = parseFeedbackResolution(comment({
              id: 900,
              login: "Wibias",
              createdAt: "2026-08-03T05:05:00Z",
              body: canonicalBody,
            }));
            assert.ok(parsed);
            assert.equal(parsed.syntaxValid, true);
            assert.deepEqual(parsed.feedbackKeys, ["issue_comment:101", "review_comment:202"]);
            assert.equal(parsed.commitRef, "d54ceec");
            assert.equal(parsed.headRef, headOid);
          });

          test("one aggregated resolution comment clears both feedback items", () => {
            const first = comment({
              id: 101,
              createdAt: "2026-08-03T05:00:00Z",
              body: "Please fix the first issue.",
            });
            const second = comment({
              id: 202,
              kind: "review_comment",
              createdAt: "2026-08-03T05:01:00Z",
              body: "Please fix the second issue.",
            });
            const record = comment({
              id: 900,
              login: "Wibias",
              createdAt: "2026-08-03T05:05:00Z",
              body: canonicalBody,
            });
            const result = evaluateFeedbackResolutions({
              feedback: [first, second, record],
              commits: [{ oid: commitOid, authoredDate: "2026-08-03T05:04:00Z", message: "fix: address feedback" }],
              myLogin: "Wibias",
              headOid,
            });
            assert.deepEqual(result.addressedKeys, ["issue_comment:101", "review_comment:202"]);
            assert.equal(result.validRecords.length, 1);
            assert.deepEqual(result.validRecords[0].resolvedFeedbackKeys, ["issue_comment:101", "review_comment:202"]);
            assert.deepEqual(result.unaddressed, []);
          });

          test("GD and legacy agent comments are never treated as trusted human feedback", () => {
            for (const body of [
              canonicalBody,
              "[github-delivery] Addressed feedback\nfeedback: issue_comment:101\ncommit: d54ceec",
              "[shipping-github] Addressed feedback\nfeedback: issue_comment:101\ncommit: d54ceec",
            ]) {
              assert.equal(isTrustedHumanFeedback(comment({
                id: body.length,
                createdAt: "2026-08-03T05:05:00Z",
                body,
              })), false);
            }
          });

          test("a marker for another head cannot clear current-head feedback", () => {
            const target = comment({
              id: 101,
              createdAt: "2026-08-03T05:00:00Z",
              body: "Please fix this.",
            });
            const stale = comment({
              id: 901,
              login: "Wibias",
              createdAt: "2026-08-03T05:05:00Z",
              body: canonicalBody.replace(headOid, "a".repeat(40)),
            });
            const result = evaluateFeedbackResolutions({
              feedback: [target, stale],
              commits: [{ oid: commitOid, authoredDate: "2026-08-03T05:04:00Z", message: "fix: address feedback" }],
              myLogin: "Wibias",
              headOid,
            });
            assert.deepEqual(result.addressedKeys, []);
            assert.ok(result.diagnostics.some((item) => item.code === "resolution_head_mismatch"));
          });
          EOF

          set +e
          node --test tests/unit/addressed-feedback-comment.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix" >&2
            exit 1
          fi
          grep -Eq "parses one GD comment|AssertionError|Cannot read properties" /tmp/red.log

      - name: Implement aggregate resolution records and GD prefix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          # Visible publication prefix only. Machine identifiers remain github-delivery:*.
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode())
              if path.as_posix() == ".github/workflows/ci.yml":
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace("[github-delivery]", "[GD]")
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="\n")

          skill = Path("SKILL.md")
          text = skill.read_text(encoding="utf-8")
          needle = "15. **Comment identity and idempotency.** One publication identity produces one `[GD]` comment. Retries, corrections, and resumed work within the same workflow run must edit that run’s own comment instead of posting duplicates.\n"
          replacement = needle + "\n    For `Addressed feedback`, the publication identity is **PR + exact current head SHA**, never the individual feedback ID. Publish at most one top-level `[GD] Addressed feedback` comment for that head. Aggregate every feedback key resolved by the same head into that comment, include `<!-- gd:addressed-feedback head:<40-char-head-sha> -->`, and edit the exact marker match when more keys are added. Never post one top-level comment per feedback item.\n"
          if needle not in text:
              raise SystemExit("SKILL idempotency insertion point missing")
          skill.write_text(text.replace(needle, replacement, 1), encoding="utf-8", newline="\n")

          shared = Path("references/shared-rules.md")
          text = shared.read_text(encoding="utf-8")
          old = """For any `[GD]` comment intent on an issue or PR (opened-PR notice, research review, security review, merge-ready, etc.):

1. Before posting, look for an existing comment **you** authored with the same intent prefix on that thread.
2. If one exists: **edit that comment** to the full final body. Do **not** post a second comment.
3. Compose the **full** body first; post once. If the create fails or the body is truncated/incomplete: **edit the same comment** to the complete text — never add a follow-up “completion” comment.
4. One intent → one comment. Truncated + full = bug; fix by edit.
"""
          new = """For any `[GD]` comment intent on an issue or PR (opened-PR notice, research review, security review, merge-ready, etc.):

1. Before posting, look for an existing comment **you** authored with the same publication identity on that thread.
2. If one exists: **edit that comment** to the full final body. Do **not** post a second comment.
3. Compose the **full** body first; post once. If the create fails or the body is truncated/incomplete: **edit the same comment** to the complete text — never add a follow-up “completion” comment.
4. One publication identity → one comment. Truncated + full = bug; fix by edit.

### Addressed-feedback identity (one comment per head)

For `[GD] Addressed feedback`, the identity key is `PR + exact current head SHA`; an individual feedback ID is **not** a publication identity.

1. Collect every trusted feedback item resolved by the current head before publishing.
2. Search your existing PR conversation comments for the exact marker `<!-- gd:addressed-feedback head:<40-char-head-sha> -->`.
3. If an exact marker match exists, edit that comment and merge the full deduplicated feedback-key set into it. If none exists, create exactly one comment.
4. Never create separate top-level comments for multiple feedback items resolved by the same head or commit.
5. Use this canonical body:

```markdown
[GD] Addressed feedback

feedbacks:
- issue_comment:123
- review_comment:456

commit: abc1234

<!-- gd:addressed-feedback head:<40-char-head-sha> -->
```

Legacy `[shipping-github]` and `[github-delivery]` resolution records remain readable as migration evidence, but every new publication uses `[GD]` and the head marker.
"""
          if old not in text:
              raise SystemExit("shared-rules idempotency block missing")
          text = text.replace(old, new, 1)
          old_single = "**Single writer:** do not run watch + fix-pr merge-ready posting concurrently on the same PR in a way that double-posts; one workflow owns the `[GD] Merge ready` comment."
          new_single = "**Single writer:** do not run watch + fix-pr concurrently on the same PR in a way that double-posts. One workflow owns the `[GD] Merge ready` comment, and one exact PR head owns one `[GD] Addressed feedback` comment."
          if old_single not in text:
              raise SystemExit("shared-rules single-writer line missing")
          shared.write_text(text.replace(old_single, new_single, 1), encoding="utf-8", newline="\n")

          gate = Path("references/gate-helpers.md")
          text = gate.read_text(encoding="utf-8")
          old = """```text
[GD] Addressed feedback
feedback: review_comment:67890
commit: abc1234
```

An unrelated later commit does not clear feedback.
"""
          new = """```text
[GD] Addressed feedback

feedbacks:
- issue_comment:12345
- review_comment:67890

commit: abc1234

<!-- gd:addressed-feedback head:<40-char-current-head-sha> -->
```

Aggregate all feedback resolved by the same current head into this single comment. Before creating it, search for the exact head marker and edit that comment when present. An unrelated later commit does not clear feedback.
"""
          if old not in text:
              raise SystemExit("gate-helpers resolution example missing")
          gate.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          watch = Path("references/watch-pr.md")
          text = watch.read_text(encoding="utf-8")
          old = """    ```markdown
    [GD] Addressed owner feedback — <one line what changed on tip>
    ```

  - **ACK-only does not clear the gate** (script requires a later non-merge commit).
"""
          new = """    ```markdown
    [GD] Addressed feedback

    feedbacks:
    - issue_comment:<id>
    - review_comment:<id>

    commit: <fix-commit>

    <!-- gd:addressed-feedback head:<40-char-current-head-sha> -->
    ```

    Collect all items fixed by the same head first. Search for the exact head marker and edit that one comment; never publish one top-level comment per feedback ID.

  - **ACK-only does not clear the gate** (script requires a later non-merge commit).
"""
          if old not in text:
              raise SystemExit("watch-pr paper-trail block missing")
          watch.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          package = Path("package.json")
          pkg = package.read_text(encoding="utf-8")
          anchor = "tests/unit/feedback-resolution.test.mjs"
          addition = anchor + " tests/unit/addressed-feedback-comment.test.mjs"
          if addition not in pkg:
              if anchor not in pkg:
                  raise SystemExit("package test anchor missing")
              pkg = pkg.replace(anchor, addition, 1)
          package.write_text(pkg, encoding="utf-8", newline="\n")

          # Intentional eval text changes require refreshed immutable hashes.
          regression = Path("tests/evals/regression-cases.jsonl")
          lock = []
          for raw in regression.read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              row = json.loads(raw)
              lock.append({"id": row["id"], "sha256": hashlib.sha256(raw.encode("utf-8")).hexdigest()})
          Path("tests/evals/regression-lock.json").write_text(json.dumps(lock, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY

          cat > scripts/lib/watch-feedback.mjs <<'EOF'
          const TRUSTED = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
          const BOT_RE = /\[bot\]$/i;
          const AGENT_PREFIX_RE = /^#{0,3}\s*\[(?:GD|github-delivery|shipping-github)\]/i;
          const RESOLUTION_HEADER_RE =
            /^#{0,3}\s*\[(?:GD|github-delivery|shipping-github)\]\s*Addressed feedback\s*$/i;
          const RESOLUTION_MARKER_RE =
            /^<!--\s*(?:gd|github-delivery|shipping-github):addressed-feedback\s+head:([0-9a-f]{40})\s*-->$/i;
          const MERGE_COMMIT_RE =
            /^(Merge (branch|remote-tracking|pull request)|merge .* into |chore:\s*merge\b)/i;
          const FEEDBACK_KEY_RE =
            /^(issue_comment|review_comment|review_submission):[A-Za-z0-9_-]+$/;
          const COMMIT_REF_RE = /^[0-9a-f]{7,40}$/i;

          export function normalizeFeedback(raw, kind) {
            return {
              key: `${kind}:${raw?.id ?? raw?.node_id ?? "unknown"}`,
              id: raw?.id ?? null,
              kind,
              url: raw?.html_url || raw?.url || null,
              login: raw?.user?.login || raw?.author?.login || null,
              association: raw?.author_association || raw?.authorAssociation || null,
              createdAt: raw?.created_at || raw?.submitted_at || raw?.createdAt || null,
              body: raw?.body || "",
              path: raw?.path || null,
              line: raw?.line || raw?.original_line || null,
            };
          }

          export function isTrustedHumanFeedback(comment, { myLogin = null } = {}) {
            if (!TRUSTED.has(comment?.association)) return false;
            if (
              !comment?.login ||
              BOT_RE.test(comment.login) ||
              comment.login === "github-actions"
            ) {
              return false;
            }
            if (myLogin && comment.login === myLogin) return false;
            const body = String(comment.body || "").trim();
            if (!body) return false;
            if (AGENT_PREFIX_RE.test(body)) return false;
            return true;
          }

          export function parseFeedbackResolution(comment) {
            const lines = String(comment?.body || "")
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean);
            if (!lines.length || !RESOLUTION_HEADER_RE.test(lines[0])) return null;

            const feedbackKeys = [];
            let commitRef = null;
            let headRef = null;
            let inFeedbackList = false;
            const errors = [];

            function addFeedbackKey(value) {
              if (!FEEDBACK_KEY_RE.test(value)) {
                errors.push("invalid_feedback");
                return;
              }
              if (feedbackKeys.includes(value)) {
                errors.push("duplicate_feedback");
                return;
              }
              feedbackKeys.push(value);
            }

            for (const line of lines.slice(1)) {
              const marker = RESOLUTION_MARKER_RE.exec(line);
              if (marker) {
                if (headRef !== null) errors.push("duplicate_head_marker");
                headRef = marker[1].toLowerCase();
                inFeedbackList = false;
                continue;
              }
              if (/^<!--.*addressed-feedback/i.test(line)) {
                errors.push("invalid_head_marker");
                inFeedbackList = false;
                continue;
              }
              if (/^feedbacks:\s*$/i.test(line)) {
                inFeedbackList = true;
                continue;
              }
              if (inFeedbackList && /^-\s+/.test(line)) {
                addFeedbackKey(line.replace(/^-\s+/, "").trim());
                continue;
              }
              inFeedbackList = false;

              const separator = line.indexOf(":");
              if (separator < 0) continue;
              const name = line.slice(0, separator).trim().toLowerCase();
              const value = line.slice(separator + 1).trim();
              if (name === "feedback") addFeedbackKey(value);
              if (name === "commit") {
                if (commitRef !== null) errors.push("duplicate_commit");
                commitRef = value;
              }
            }

            if (!feedbackKeys.length) errors.push("invalid_feedback");
            if (!commitRef || !COMMIT_REF_RE.test(commitRef)) {
              errors.push("invalid_commit");
            }

            return {
              recordKey: comment?.key || null,
              recordId: comment?.id || null,
              login: comment?.login || null,
              createdAt: comment?.createdAt || null,
              url: comment?.url || null,
              feedbackKey: feedbackKeys.length === 1 ? feedbackKeys[0] : null,
              feedbackKeys,
              commitRef,
              headRef,
              syntaxValid: errors.length === 0,
              errors: [...new Set(errors)],
            };
          }

          function diagnostic(record, code, extra = {}) {
            return {
              recordKey: record?.recordKey || null,
              code,
              feedbackKey: record?.feedbackKey || null,
              commitRef: record?.commitRef || null,
              ...extra,
            };
          }

          function commitTimestamp(commit) {
            return Date.parse(commit?.authoredDate || commit?.committedDate || "");
          }

          export function evaluateFeedbackResolutions({
            feedback = [],
            commits = [],
            myLogin = null,
            headOid = null,
          } = {}) {
            const actionableFeedback = feedback.filter((comment) =>
              isTrustedHumanFeedback(comment, { myLogin }),
            );
            const actionableByKey = new Map(
              actionableFeedback.map((comment) => [comment.key, comment]),
            );
            const records = feedback.map(parseFeedbackResolution).filter(Boolean);
            const diagnostics = [];
            const validRecords = [];
            const addressed = new Set();

            for (const record of records) {
              if (!record.syntaxValid) {
                diagnostics.push(
                  diagnostic(record, "malformed_resolution_record", {
                    errors: record.errors,
                  }),
                );
                continue;
              }
              if (!myLogin || record.login !== myLogin) {
                diagnostics.push(diagnostic(record, "resolution_author_mismatch"));
                continue;
              }
              if (
                record.headRef &&
                headOid &&
                record.headRef.toLowerCase() !== String(headOid).toLowerCase()
              ) {
                diagnostics.push(
                  diagnostic(record, "resolution_head_mismatch", {
                    recordHead: record.headRef,
                    currentHead: headOid,
                  }),
                );
                continue;
              }

              const normalizedRef = record.commitRef.toLowerCase();
              const matches = commits.filter((commit) =>
                String(commit?.oid || "").toLowerCase().startsWith(normalizedRef),
              );
              if (!matches.length) {
                diagnostics.push(diagnostic(record, "commit_not_found"));
                continue;
              }
              if (matches.length > 1) {
                diagnostics.push(
                  diagnostic(record, "commit_ambiguous", { matchCount: matches.length }),
                );
                continue;
              }

              const commit = matches[0];
              const message = String(commit?.message || "").trim();
              if (!message || MERGE_COMMIT_RE.test(message)) {
                diagnostics.push(diagnostic(record, "commit_is_merge"));
                continue;
              }

              const fixedTime = commitTimestamp(commit);
              const recordTime = Date.parse(record.createdAt || "");
              if (!Number.isFinite(fixedTime) || !Number.isFinite(recordTime)) {
                diagnostics.push(diagnostic(record, "timestamp_invalid"));
                continue;
              }
              if (recordTime < fixedTime) {
                diagnostics.push(diagnostic(record, "resolution_before_commit"));
                continue;
              }

              const resolvedFeedbackKeys = [];
              for (const feedbackKey of record.feedbackKeys) {
                const target = actionableByKey.get(feedbackKey);
                if (!target) {
                  diagnostics.push(
                    diagnostic(record, "feedback_not_found", { feedbackKey }),
                  );
                  continue;
                }
                const feedbackTime = Date.parse(target.createdAt || "");
                if (!Number.isFinite(feedbackTime)) {
                  diagnostics.push(
                    diagnostic(record, "timestamp_invalid", { feedbackKey }),
                  );
                  continue;
                }
                if (fixedTime <= feedbackTime) {
                  diagnostics.push(
                    diagnostic(record, "commit_not_after_feedback", { feedbackKey }),
                  );
                  continue;
                }
                addressed.add(target.key);
                resolvedFeedbackKeys.push(target.key);
              }

              if (resolvedFeedbackKeys.length) {
                validRecords.push({
                  ...record,
                  resolvedFeedbackKeys: [...resolvedFeedbackKeys].sort(),
                  resolvedCommitOid: commit.oid,
                  commitCreatedAt:
                    commit.authoredDate || commit.committedDate || null,
                });
              }
            }

            return {
              actionableFeedback,
              records,
              validRecords,
              diagnostics,
              addressedKeys: [...addressed].sort(),
              unaddressed: actionableFeedback.filter(
                (comment) => !addressed.has(comment.key),
              ),
            };
          }

          export function findUnaddressedFeedback(options = {}) {
            return evaluateFeedbackResolutions(options).unaddressed;
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/lib/snapshot-evaluators.mjs")
          text = path.read_text(encoding="utf-8")
          old_call = "const resolution = evaluateFeedbackResolutions({ feedback, commits, myLogin });"
          new_call = "const resolution = evaluateFeedbackResolutions({ feedback, commits, myLogin, headOid: snapshot.headOid });"
          if old_call not in text:
              raise SystemExit("snapshot resolution call missing")
          text = text.replace(old_call, new_call, 1)

          old_anchor = """  for (const comment of unaddressed) {
    blockers.push({
"""
          new_anchor = """  const addressedFeedbackTemplate = unaddressed.length
    ? `[GD] Addressed feedback\n\nfeedbacks:\n${unaddressed
        .map((comment) => `- ${comment.key}`)
        .join("\\n")}\n\ncommit: <7-40 character PR commit SHA>\n\n<!-- gd:addressed-feedback head:${snapshot.headOid} -->`
    : null;
  for (const comment of unaddressed) {
    blockers.push({
"""
          if old_anchor not in text:
              raise SystemExit("snapshot blocker loop missing")
          text = text.replace(old_anchor, new_anchor, 1)

          import re
          text, count = re.subn(
              r'howToClear: `\[GD\] Addressed feedback\\nfeedback: \$\{comment\.key\}\\ncommit: <7-40 character PR commit SHA>`,',
              'howToClear: addressedFeedbackTemplate,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("snapshot howToClear replacement missing")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          if git grep -n '\[github-delivery\]' -- ':!tests/unit/addressed-feedback-comment.test.mjs'; then
            echo "Visible long-form comment prefix remains" >&2
            exit 1
          fi

      - name: Verify GREEN
        run: |
          node --test tests/unit/addressed-feedback-comment.test.mjs
          npm run check

      - name: Commit tested implementation without bootstrap workflow
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: deduplicate addressed-feedback comments'
          git push origin HEAD:agent/github-delivery

  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Run checks
        run: npm run check
