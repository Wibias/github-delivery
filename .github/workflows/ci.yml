name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-addressed-feedback-fix:
    name: Apply addressed-feedback fix
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/github-delivery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/github-delivery

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply implementation
        shell: bash
        run: |
          cp .github/workflows/ci.yml /tmp/bootstrap-ci.yml
          git checkout origin/main -- .github/workflows/ci.yml
          node scripts/apply-addressed-feedback-fix.mjs
          node scripts/overwrite-watch-feedback.mjs

      - name: Verify focused regression and full repository
        run: |
          node --test tests/unit/addressed-feedback-comment.test.mjs
          npm run check

      - name: Commit tested implementation
        shell: bash
        run: |
          cp /tmp/bootstrap-ci.yml .github/workflows/ci.yml
          rm scripts/apply-addressed-feedback-fix.mjs
          rm scripts/overwrite-watch-feedback.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: deduplicate addressed-feedback comments'
          git push origin HEAD:agent/github-delivery

  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Run checks
        run: npm run check
