name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Run checks
        run: npm run check

      - name: Restore Windows authority host in locked mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          $ErrorActionPreference = 'Continue'
          & dotnet restore $Project --locked-mode --verbosity minimal 2>&1 |
            Tee-Object -FilePath authority-host-restore.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content authority-host-restore.log | Select-Object -Last 10 | ForEach-Object {
              $line = $_ -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error::$line"
            }
            exit $exitCode
          }

      - name: Build Windows authority host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & dotnet build authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-restore 2>&1 |
            Tee-Object -FilePath authority-host-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content authority-host-build.log | ForEach-Object {
              $line = $_ -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error::$line"
            }
            exit $exitCode
          }

      - name: Run Windows authority host self-test
        if: runner.os == 'Windows'
        run: dotnet run --project authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-build -- --self-test
