name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_compat: ${{ steps.scope.outputs.node_compat }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Detect Node compatibility scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "node_compat=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          TRUSTED_SCOPE="${RUNNER_TEMP}/github-delivery-ci-scope-base.mjs"
          git show "${BASE_SHA}:scripts/ci-scope.mjs" > "${TRUSTED_SCOPE}"
          git diff --name-only -z "${BASE_SHA}"...HEAD |
            node "${TRUSTED_SCOPE}" --mode ci >> "${GITHUB_OUTPUT}"

  core:
    name: Node 24 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run canonical repository checks
        run: npm run check

      # Node 26 is supported, but version-independent repository/security/dist
      # gates already ran above. Re-run only runtime-sensitive syntax, package,
      # and unit contracts under Node 26.
      - name: Set up Node.js 26 compatibility runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Verify Node 26 compatibility
        run: node scripts/check-syntax.mjs && npm run package:check && npm test

  node22-compatibility:
    name: Node 22 / ubuntu-latest
    needs: scope
    if: always() && (needs.scope.result != 'success' || github.event_name != 'pull_request' || needs.scope.outputs.node_compat == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail closed when scope detection failed
        if: needs.scope.result != 'success'
        run: |
          echo "::error::Detect CI scope did not complete successfully."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Node 22 compatibility
        run: npm run build:dist && node scripts/check-syntax.mjs && npm run package:check && npm test

  windows-authority:
    name: Node 24 / windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate Windows authority installer syntax
        shell: pwsh
        run: |
          $Installer = Get-Content authority-host/windows/install.ps1 -Raw
          [void][scriptblock]::Create($Installer)
          $ReleaseInstaller = Get-Content authority-host/windows/install-release.ps1 -Raw
          [void][scriptblock]::Create($ReleaseInstaller)
          $LockProbe = Get-Content scripts/windows-install-locks.ps1 -Raw
          [void][scriptblock]::Create($LockProbe)

      - name: Exercise Windows update lock probe
        shell: pwsh
        run: |
          $ProbeTarget = Join-Path $env:RUNNER_TEMP 'github-delivery-lock-probe'
          New-Item -ItemType Directory -Path $ProbeTarget -Force | Out-Null
          $ProbeJson = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/windows-install-locks.ps1 `
            -Mode Inspect `
            -Target $ProbeTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ProbeText = ($ProbeJson -join "`n").Trim()
          if (-not $ProbeText.StartsWith('[')) {
            throw "Windows update lock probe returned unexpected output: $ProbeText"
          }
          [void]($ProbeText | ConvertFrom-Json)

      - name: Restore Windows authority host in locked mode
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          dotnet restore $Project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows authority host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & dotnet build authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-restore 2>&1 |
            Tee-Object -FilePath authority-host-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content authority-host-build.log | ForEach-Object {
              $line = $_ -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error::$line"
            }
            exit $exitCode
          }

      - name: Run Windows authority host self-test
        run: dotnet run --project authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-build -- --self-test

      - name: Run Windows authority host XAML smoke test
        shell: pwsh
        run: |
          dotnet run --project authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-build -- --xaml-self-test
          if ($LASTEXITCODE -ne 0) {
            $Diagnostics = Join-Path $env:LOCALAPPDATA 'GitHubDeliveryAuthority\startup-error.log'
            if (Test-Path $Diagnostics -PathType Leaf) { Get-Content $Diagnostics }
            exit $LASTEXITCODE
          }

      - name: Publish Windows authority host
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          $PublishDir = Join-Path $env:RUNNER_TEMP 'github-delivery-authority-publish'
          dotnet publish $Project --configuration Release --runtime win-x64 --self-contained true --no-restore --output $PublishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($CompiledXaml in @('App.xbf', 'ApprovalWindow.xbf', 'ControlCenterWindow.xbf')) {
            $CompiledXamlPath = Join-Path $PublishDir $CompiledXaml
            if (-not (Test-Path $CompiledXamlPath -PathType Leaf)) {
              throw "Published authority host is missing compiled XAML resource: $CompiledXaml"
            }
          }
          $ResourceIndex = Join-Path $PublishDir 'resources.pri'
          if (-not (Test-Path $ResourceIndex -PathType Leaf)) {
            throw 'Published authority host is missing the unpackaged WinUI resource index: resources.pri'
          }
          $AuthorityIcon = Join-Path $PublishDir 'Assets\DeliveryAuthority.ico'
          if (-not (Test-Path $AuthorityIcon -PathType Leaf)) {
            throw 'Published authority host is missing Assets\DeliveryAuthority.ico'
          }
          $DepsPath = Join-Path $PublishDir 'GitHubDeliveryAuthority.deps.json'
          $Deps = Get-Content $DepsPath -Raw | ConvertFrom-Json
          $RuntimePackage = $Deps.libraries.PSObject.Properties.Name |
            Where-Object { $_ -like 'runtimepack.Microsoft.NETCore.App.Runtime.win-x64/*' }
          if ($RuntimePackage -ne 'runtimepack.Microsoft.NETCore.App.Runtime.win-x64/8.0.30') {
            throw "Published authority host bundled unexpected runtime: $RuntimePackage"
          }
          $Executable = Join-Path $PublishDir 'GitHubDeliveryAuthority.exe'
          if (-not (Test-Path $Executable -PathType Leaf)) {
            throw 'Published authority executable is missing.'
          }
          & $Executable --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Published authority executable self-test failed with exit code $LASTEXITCODE."
          }
          & $Executable --xaml-self-test
          if ($LASTEXITCODE -ne 0) {
            $Diagnostics = Join-Path $env:LOCALAPPDATA 'GitHubDeliveryAuthority\startup-error.log'
            if (Test-Path $Diagnostics -PathType Leaf) { Get-Content $Diagnostics }
            throw "Published authority executable XAML smoke test failed with exit code $LASTEXITCODE."
          }

          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $SmokeWorkspace = Join-Path $env:RUNNER_TEMP 'github-delivery-authority-release-smoke'
          $PreparedJson = node scripts/prepare-authority-host-runtime-smoke.mjs `
            --publish-dir $PublishDir `
            --workspace $SmokeWorkspace `
            --version $Version `
            --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Prepared = $PreparedJson | ConvertFrom-Json

          $InstallDir = Join-Path $env:RUNNER_TEMP 'github-delivery-authority-installed-smoke'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File authority-host/windows/install-release.ps1 `
            -SourceDir $Prepared.source `
            -ExpectedVersion $Version `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -InstallDir $InstallDir `
            -SkipStart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $InstalledExecutable = Join-Path $InstallDir "app\v$Version\GitHubDeliveryAuthority.exe"
          if (-not (Test-Path $InstalledExecutable -PathType Leaf)) {
            throw 'Installed Authority smoke executable is missing.'
          }
          $InstalledIcon = Join-Path $InstallDir "app\v$Version\Assets\DeliveryAuthority.ico"
          if (-not (Test-Path $InstalledIcon -PathType Leaf)) {
            throw 'Installed Authority icon is missing.'
          }
          & $InstalledExecutable --xaml-self-test
          if ($LASTEXITCODE -ne 0) {
            $Diagnostics = Join-Path $env:LOCALAPPDATA 'GitHubDeliveryAuthority\startup-error.log'
            if (Test-Path $Diagnostics -PathType Leaf) { Get-Content $Diagnostics }
            throw "Installed Authority XAML smoke test failed with exit code $LASTEXITCODE."
          }
