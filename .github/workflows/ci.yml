name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/execute-behavioral-evals

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 5

      - name: Emit non-force restack tree blueprint
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "${PR_HEAD_SHA}" --depth=4
          git show "${PR_HEAD_SHA}~3:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          tree_sha="$(git write-tree)"
          echo "RESTACK_TREE_SHA=${tree_sha}"
          echo "RESTACK_TREE_BEGIN"
          git ls-tree -r "${tree_sha}"
          echo "RESTACK_TREE_END"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Run checks
        run: npm run check
