name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Probe final roadmap acceptance
        continue-on-error: true
        run: node --test tests/unit/final-roadmap-acceptance.test.mjs

      - name: Probe mutation modes docs
        continue-on-error: true
        run: node --test tests/unit/mutation-modes-docs.test.mjs

      - name: Probe mutation policy
        continue-on-error: true
        run: node --test tests/unit/mutation-policy.test.mjs tests/unit/mutation-policy-cli.test.mjs

      - name: Probe policy contracts
        continue-on-error: true
        run: node --test tests/unit/policy-architecture.test.mjs tests/unit/policy-bundle.test.mjs

      - name: Probe bare GitHub mentions
        continue-on-error: true
        run: node --test tests/unit/bare-github-mentions.test.mjs

      - name: Probe distribution contracts
        continue-on-error: true
        run: node --test tests/unit/distribution.test.mjs tests/unit/distribution-authority-host.test.mjs

      - name: Probe review contracts
        continue-on-error: true
        run: node --test tests/unit/review-context-contract.test.mjs tests/unit/simplify-review-contract.test.mjs

      - name: Probe router contracts
        continue-on-error: true
        run: node --test tests/unit/skill-router.test.mjs tests/unit/create-pr-local-route.test.mjs

      - name: Probe workflow security contracts
        continue-on-error: true
        run: node --test tests/unit/workflow-security.test.mjs tests/unit/mutation-boundary-security.test.mjs

      - name: Probe broker contracts
        continue-on-error: true
        run: node --test tests/unit/github-mutation-broker.test.mjs tests/unit/mutation-action-registry-broker.test.mjs

      - name: Probe unit tests
        run: npm test

      - name: Run checks
        run: npm run check

      - name: Verify architecture contracts
        run: >-
          node --test
          tests/unit/mutation-action-registry.test.mjs
          tests/unit/mutation-action-registry-broker.test.mjs
          tests/unit/review-context-contract.test.mjs

      - name: Validate Windows authority installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Installer = Get-Content authority-host/windows/install.ps1 -Raw
          [void][scriptblock]::Create($Installer)

      - name: Restore Windows authority host in locked mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          dotnet restore $Project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows authority host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & dotnet build authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-restore 2>&1 |
            Tee-Object -FilePath authority-host-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content authority-host-build.log | ForEach-Object {
              $line = $_ -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error::$line"
            }
            exit $exitCode
          }

      - name: Run Windows authority host self-test
        if: runner.os == 'Windows'
        run: dotnet run --project authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj --configuration Release --no-build -- --self-test
