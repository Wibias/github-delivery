name: Authority responsive validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          global-json-file: global.json

      - name: Restore Authority host
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          dotnet restore $Project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish and smoke-test Authority host
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          $PublishDir = Join-Path $env:RUNNER_TEMP 'github-delivery-authority-responsive-validation'
          dotnet publish $Project --configuration Release --runtime win-x64 --self-contained true --no-restore --output $PublishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($File in @('App.xbf', 'ApprovalWindow.xbf', 'ControlCenterWindow.xbf', 'resources.pri', 'GitHubDeliveryAuthority.exe', 'Assets\DeliveryAuthority.ico')) {
            $Path = Join-Path $PublishDir $File
            if (-not (Test-Path $Path -PathType Leaf)) { throw "Validation build is missing $File" }
          }

          $Executable = Join-Path $PublishDir 'GitHubDeliveryAuthority.exe'
          & $Executable --self-test
          if ($LASTEXITCODE -ne 0) { throw "Authority self-test failed with exit code $LASTEXITCODE" }
          & $Executable --xaml-self-test
          if ($LASTEXITCODE -ne 0) {
            $Diagnostics = Join-Path $env:LOCALAPPDATA 'GitHubDeliveryAuthority\startup-error.log'
            if (Test-Path $Diagnostics -PathType Leaf) { Get-Content $Diagnostics }
            throw "Authority XAML self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload responsive validation build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-delivery-authority-responsive-validation
          path: ${{ runner.temp }}\github-delivery-authority-responsive-validation
          if-no-files-found: error
          retention-days: 2
