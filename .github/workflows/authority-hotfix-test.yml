name: Authority 0.8.1 test build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Authority test ZIP
    runs-on: windows-latest
    steps:
      - name: Check out hotfix
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore and build
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          dotnet restore $Project --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $Project --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Authority tests
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          dotnet run --project $Project --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project $Project --configuration Release --no-build -- --xaml-self-test
          if ($LASTEXITCODE -ne 0) {
            $Diagnostics = Join-Path $env:LOCALAPPDATA 'GitHubDeliveryAuthority\startup-error.log'
            if (Test-Path $Diagnostics -PathType Leaf) { Get-Content $Diagnostics }
            exit $LASTEXITCODE
          }

      - name: Publish self-contained Authority
        shell: pwsh
        run: |
          $Project = 'authority-host/windows/GitHubDeliveryAuthority/GitHubDeliveryAuthority.csproj'
          $PublishDir = Join-Path $env:RUNNER_TEMP 'authority-0.8.1-test'
          dotnet publish $Project --configuration Release --runtime win-x64 --self-contained true --no-restore --output $PublishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $PublishDir 'GitHubDeliveryAuthority.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $PublishDir 'GitHubDeliveryAuthority.exe') --xaml-self-test
          if ($LASTEXITCODE -ne 0) {
            $Diagnostics = Join-Path $env:LOCALAPPDATA 'GitHubDeliveryAuthority\startup-error.log'
            if (Test-Path $Diagnostics -PathType Leaf) { Get-Content $Diagnostics }
            exit $LASTEXITCODE
          }
          $VersionInfo = @{
            schemaVersion = 1
            kind = 'github-delivery/authority-host-version'
            version = '0.8.1'
            sourceCommit = $env:GITHUB_SHA
            platform = 'win32'
            arch = 'x64'
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $PublishDir 'authority-host-version.json') -Value $VersionInfo -Encoding utf8
          Compress-Archive -Path (Join-Path $PublishDir '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'github-delivery-authority-v0.8.1-test-win-x64.zip') -Force

      - name: Upload test ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: github-delivery-authority-v0.8.1-test-win-x64
          path: ${{ runner.temp }}/github-delivery-authority-v0.8.1-test-win-x64.zip
          if-no-files-found: error
          retention-days: 3
