name: Repository Policy

on:
  pull_request:
    paths:
      - .github/repository-policy.json
      - .github/workflows/repository-policy.yml
      - scripts/verify-live-repository-policy.mjs
      - scripts/lib/workflow-security.mjs
      - tests/unit/workflow-security.test.mjs
  push:
    branches:
      - main
    paths:
      - .github/repository-policy.json
      - .github/workflows/repository-policy.yml
      - scripts/verify-live-repository-policy.mjs
      - scripts/lib/workflow-security.mjs
      - tests/unit/workflow-security.test.mjs
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate candidate repository security policy
        run: node scripts/validate-repository-security.mjs

      - name: Verify live GitHub policy matches current or proposed policy
        shell: bash
        env:
          # github.token cannot attest ruleset bypass actors. Prefer a repo-admin token.
          GH_TOKEN: ${{ secrets.REPOSITORY_POLICY_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Normal push/schedule runs are strict: live GitHub settings must match
          # the policy checked into the commit being verified, including bypass
          # attestation. github.token cannot attest bypass, so those events stay
          # red until REPOSITORY_POLICY_TOKEN is a repo-admin token.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            node scripts/verify-live-repository-policy.mjs "${GITHUB_REPOSITORY}"
            exit 0
          fi

          # A policy-changing PR may be checked before or after its corresponding
          # live ruleset migration. Accept either fully consistent endpoint, but
          # never a partially migrated state that matches neither policy.
          # EVENT_NAME=pull_request lets the verifier pass when the only live gap
          # is that github.token cannot attest ruleset bypass.
          if node scripts/verify-live-repository-policy.mjs "${GITHUB_REPOSITORY}"; then
            exit 0
          fi

          BASE_POLICY_ROOT="${RUNNER_TEMP}/repository-policy-base"
          mkdir -p "${BASE_POLICY_ROOT}/.github"
          git show "${BASE_SHA}:.github/repository-policy.json" > "${BASE_POLICY_ROOT}/.github/repository-policy.json"
          node scripts/verify-live-repository-policy.mjs "${GITHUB_REPOSITORY}" "${BASE_POLICY_ROOT}"
