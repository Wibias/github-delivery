name: Repository Policy

on:
  pull_request:
    paths:
      - .github/repository-policy.json
      - .github/workflows/repository-policy.yml
      - scripts/verify-live-repository-policy.mjs
      - scripts/lib/workflow-security.mjs
      - tests/unit/workflow-security.test.mjs
  push:
    branches:
      - main
    paths:
      - .github/repository-policy.json
      - .github/workflows/repository-policy.yml
      - scripts/verify-live-repository-policy.mjs
      - scripts/lib/workflow-security.mjs
      - tests/unit/workflow-security.test.mjs
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify live GitHub policy matches policy-as-code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-live-repository-policy.mjs "${{ github.repository }}"
