name: Audit generation 10 patch

on:
  push:
    branches:
      - fix/audit-generation-10
    paths:
      - scripts/audit-generation-10-patch.py
      - .github/workflows/audit-generation-10-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/audit-generation-10
          fetch-depth: 0
          persist-credentials: false

      - name: Apply assertion-guarded patch
        run: python scripts/audit-generation-10-patch.py

      - name: Commit patched production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/skill-router.mjs \
                  scripts/lib/mutation-boundary-security.mjs \
                  scripts/lib/snapshot-evaluators.mjs \
                  scripts/merge-pr-driver.mjs \
                  tests/unit/audit-generation-10-regressions.test.mjs
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: close audit routing and boundary gaps"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/audit-generation-10
